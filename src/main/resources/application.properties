spring.application.name=Student-Management-Project
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

name.aggregation.service-name=${NAME_AGGREGATION_SERVICE_NAME:April}
downstream.name-aggregation.url=${DOWNSTREAM_NAME_AGGREGATION_URL:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:748012898312-5235k6up5bk9v0jsa6e50bifott0nn6r.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.security.admin-emails=${APP_SECURITY_ADMIN_EMAILS:jackiewangjiayi513@gmail.com}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:19093,localhost:19094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

app.kafka.topic-name=${APP_KAFKA_TOPIC_NAME:student-events}
app.kafka.partitions=${APP_KAFKA_PARTITIONS:3}
app.kafka.replication-factor=${APP_KAFKA_REPLICATION_FACTOR:3}
app.kafka.consumer-group-id=${APP_KAFKA_CONSUMER_GROUP_ID:student-management-consumers}
app.kafka.listener-concurrency=${APP_KAFKA_LISTENER_CONCURRENCY:3}
app.kafka.consumed-message-history-limit=${APP_KAFKA_CONSUMED_MESSAGE_HISTORY_LIMIT:100}
